[build-system]
# Upper bound matches the next minor of the currently-released uv_build
# series (0.11.x), as recommended by the uv docs.
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[project]
name = "dbx-tools-config"
version = "0.1.7"
description = "Build and fingerprint databricks.sdk Config instances from server-supplied env or kwargs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["databricks-sdk"]
# PEP 639: SPDX identifier in ``license`` plus explicit ``license-files``;
# the deprecated ``License :: OSI Approved :: ...`` classifier is gone.
license = "Unlicense"
license-files = ["LICENSE"]
keywords = [
    "databricks",
    "databricks-sdk",
    "config",
    "mcp",
    "multi-tenant",
    "fingerprint",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff", "bump-my-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []

[tool.bumpversion]
current_version = "0.1.7"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
